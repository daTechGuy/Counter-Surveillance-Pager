# Known-good SSID -> BSSID mappings for rogue "evil twin" AP detection. A
# Beacon frame advertising one of these SSID names from a BSSID NOT listed
# here is flagged as a possible spoofed AP impersonating your own network
# (a real intercept tactic: an attacker broadcasts your home/work WiFi's
# name so your devices auto-connect to them instead).
#
# One entry per line:
#   trusted:SSID_NAME|XX:XX:XX:XX:XX:XX
#
# Add ONE line per legitimate access point for that SSID. Mesh WiFi systems
# (Eero, Orbi, Google WiFi, etc.) and dual-band routers legitimately
# broadcast the SAME SSID from MULTIPLE different BSSIDs -- list all of
# them, or your own hardware will trigger false positives the moment it
# roams between its own access points.
#
# Ships EMPTY on purpose: only you know your own network's real name and
# BSSID(s) -- there's no vendor list to seed this with the way
# mesh_detect_targets.conf had real sourced OUI data available. Find yours
# from another device's WiFi settings, or your router's admin page.
#
# KNOWN LIMITATION: parsing splits on "|", so an SSID containing a literal
# "|" character isn't supported by this format (rare in practice, not
# handled). Matching is exact and case-sensitive (SSIDs are case-sensitive
# per the 802.11 spec).
#
# Examples (commented out):
# trusted:MyHomeWiFi|aa:bb:cc:dd:ee:ff
# trusted:MyHomeWiFi|11:22:33:44:55:66
