# Mesh-Detect target list -- generalized BLE + WiFi surveillance-device
# matching, modeled on colonelpanichacks/Esp32-oui-sniffer's three detection
# methods (OUI prefix, full MAC, BLE device-name substring). That firmware
# configures targets through a web UI at first boot; this device has no such
# portal, so the same target list lives here as a plain text file instead.
#
# One target per line. Blank lines and lines starting with # are ignored.
# Inline comments (# after a target) are also stripped. Matching is
# case-insensitive. Leading/trailing whitespace is trimmed.
#
#   oui:XX:XX:XX          -- MAC OUI (first 3 bytes). Matches BLE devices
#                             and the transmitter MAC of WiFi management
#                             frames (management frames only -- same frames
#                             the Flock WiFi detector already captures).
#   mac:XX:XX:XX:XX:XX:XX -- exact MAC address. Same BLE + WiFi coverage
#                             as oui: above.
#   name:substring         -- BLE advertised-name substring match. BLE only:
#                             WiFi management frames don't carry a
#                             comparable per-device name field the way BLE
#                             advertisements do.
#
# ============================================================================
# WHERE THIS DATA CAME FROM
# ============================================================================
# Seeded from nitekry/nite-oui-collection (github.com/nitekry/nite-oui-collection),
# a dedicated, actively field-tested OUI-tracking project -- specifically:
#   groups/privacy_invaders/privacy_invaders_ouis.csv     (vendor-labeled OUIs)
#   groups/privacy_invaders/privacy_invaders_ouis_law_enforcement.csv
#   groups/osint-collection                                (additional single OUIs)
#   groups/le/le_detect + groups/le/observed_devices        ("BodyWorn Remote"
#                                                             confirmed BLE name)
# Deliberately NOT seeded from:
#   groups/le/unknown_devices -- these are observed devices with randomized
#     ("locally administered") MACs, not stable vendor OUIs. A static list
#     entry for a randomized MAC only ever matches that one already-gone
#     session; it's not something a fixed watchlist can usefully encode.
#   groups/others/Tesla OUI detection -- vehicle WiFi-hotspot detection, not
#     a personal surveillance device in the same sense as the rest of this
#     list, and would fire on literally any nearby Tesla owner's own car.
#     Add it yourself (oui: lines, same format) if you specifically want that.
#   Zebra Printer OUIs (from le_detect) -- Zebra is a generic enterprise
#     label/ID-printer brand used far outside any LE context (retail,
#     logistics, healthcare); including it would mostly flag ordinary
#     printers, not surveillance gear.
#
# ============================================================================
# TWO TIERS, BY FALSE-POSITIVE RISK
# ============================================================================
# TIER 1 (below, active): purpose-built LE/surveillance/ALPR/dedicated-CCTV
#   hardware. These vendors don't also sell generic consumer WiFi routers/APs
#   under the same OUI blocks, so a hit here is a real signal.
# TIER 2 (further down, commented out): consumer/SMB camera brands that also
#   sell (or share OUI blocks with) ordinary consumer routers and access
#   points -- Ubiquiti above all (two of its OUI blocks, 94:2a:6f and
#   f4:e2:c6, already had to be pulled from the Flock WiFi detector's own
#   list as confirmed false positives -- see flock_wifi_monitor.awk). These
#   WILL cause more false positives (a neighbor's ordinary WiFi AP, not
#   someone surveilling you). Uncomment individual lines if you want the
#   broader coverage and are OK with that tradeoff.
#
# This is a data-only expansion -- it adds zero new capture processes, zero
# new radio time, and zero new BLE/WiFi scan windows. It runs entirely
# inside the Mesh-Detect matching passes that already exist (the BLE pass
# reuses the Flock BLE scan's own hcitool lescan output; the WiFi pass reuses
# mesh_wifi_monitor.awk's own already-running tcpdump reader). More targets
# here costs a few more OUI/MAC string comparisons per detected device per
# scan cycle -- not meaningfully more CPU, and no more device load at all.

