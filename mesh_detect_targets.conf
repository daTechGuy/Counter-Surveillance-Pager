# --- Smart glasses / AR wearables (camera-equipped) -------------------------
# SOURCING CAVEAT, different from everything above: these OUIs come from
# cncartistsec/BluePine-WiFi-Pineapple-Pager's funcs_scan.sh, which does not
# itself cite a source (unlike this file's TIER 1 list above, cross-checked
# against nite-oui-collection). Not independently verified against the IEEE
# OUI registry or a field-testing tracker -- treat these as a starting point,
# not a vetted list the way the rest of TIER 1 is.
# Vuzix and Snap kept active here (narrow, AR/wearables-focused product
# lines, lower false-positive risk). Meta, Amazon, and Razer moved to TIER 2
# below on purpose: all three are broad consumer-electronics vendors whose
# OUI blocks likely aren't glasses-exclusive (Meta also ships Quest/Portal,
# Amazon ships Echo/Fire TV/Kindle/Ring, Razer ships gaming peripherals) --
# same false-positive reasoning already applied to Ubiquiti's WiFi router
# OUIs elsewhere in this file, not a new policy.
