# Rogue BLE tracker allowlist -- MACs to never alert on, e.g. your own
# AirTag/Tile/SmartTag that legitimately travels with you every day. This
# file is loaded ONCE at startup and meant to be PERMANENT, edited ahead of
# time. If instead you want to temporarily ignore some OTHER tracker you
# already know about right now (a neighbor's AirTag through a wall, a
# coworker's Tile) for a few hours without editing this file, use
# snooze_tracker.sh instead -- it works on an already-running session, no
# restart needed, and expires on its own.
#
# One entry per line, format:
#   mac:XX:XX:XX:XX:XX:XX
# Blank lines and lines starting with # are ignored. Inline comments (#
# after an entry) are stripped. Case-insensitive.
#
# ============================================================================
# WHY THIS NEEDS MAINTENANCE (READ BEFORE RELYING ON IT)
# ============================================================================
# Apple Find My, Samsung SmartTag, and Google FMDN accessories all rotate
# their BLE MAC address periodically (order of ~15+ minutes, exact interval
# not publicly fixed) specifically to defeat this kind of static tracking --
# including, unavoidably, YOUR OWN tag's tracking of itself. A MAC you add
# here today will eventually go stale and your own tag will start
# generating alerts again.
#
#   - Tile is the exception: its MAC does not rotate, so a Tile entry here
#     is permanent.
#   - For the rotating protocols (Apple/Samsung/Google), there is no
#     "add once, forget forever" option available at this layer -- properly
#     suppressing your own tag without any re-maintenance would require
#     deriving its actual rotating identity from your own account
#     credentials (e.g. exporting your AirTag's private key the way
#     seemoo-lab/openhaystack does for its OWN accessories), which is out
#     of scope here. When you next see your own tag alert, check the loot
#     log for its current MAC and add it below.
#
# Check /root/loot/counter_surveillance_pager/surveillance_<ts>.txt (or
# watch the on-screen alerts) for the MAC to add.

# mac:aa:bb:cc:dd:ee:ff   # example: my own AirTag, added 2026-08-15
